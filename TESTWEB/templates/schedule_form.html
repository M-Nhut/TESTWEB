{% extends "layout.html" %}
{% block content %}
<div class="mb-8">
    <h1 class="text-2xl font-bold tracking-tight text-slate-900">Sửa lịch học</h1>
    <p class="text-sm text-slate-500 mt-1">Cập nhật thông tin thời gian, phòng học cho lịch hiện tại.</p>
</div>

<div class="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden max-w-4xl">
    <div class="p-6">
        <form method="post" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-6 gap-6">
                {% include "schedule_fields.html" %}
            </div>

            <div class="pt-4 flex items-center gap-3 border-t border-slate-100">
                <button type="submit" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-950 bg-slate-900 text-slate-50 hover:bg-slate-900/90 h-10 px-6">
                    <i data-lucide="save" class="w-4 h-4 mr-2"></i> Lưu thay đổi
                </button>
                <a href="{{ url_for('schedules') }}" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 border border-slate-200 bg-white hover:bg-slate-100 hover:text-slate-900 h-10 px-4">
                    Hủy
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
