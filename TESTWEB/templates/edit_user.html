{% extends "layout.html" %}
{% block content %}
<div class="mb-8">
    <h1 class="text-2xl font-bold tracking-tight text-slate-900">Sửa thông tin người dùng</h1>
    <p class="text-sm text-slate-500 mt-1">Cập nhật hồ sơ hoặc đặt lại mật khẩu cho {{ user.fullname }}.</p>
</div>

<div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="md:col-span-2">
        <div class="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">
            <div class="p-6">
                <form method="post" class="space-y-6">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div class="space-y-2">
                            <label class="text-sm font-medium leading-none text-slate-900">Họ tên</label>
                            <input name="fullname" class="flex h-10 w-full rounded-md border border-slate-300 bg-transparent px-3 py-2 text-sm placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900 transition-colors" value="{{ user.fullname }}" required>
                        </div>
                        <div class="space-y-2">
                            <label class="text-sm font-medium leading-none text-slate-900">Username</label>
                            <input name="username" class="flex h-10 w-full rounded-md border border-slate-300 bg-transparent px-3 py-2 text-sm placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900 transition-colors" value="{{ user.username }}" required>
                        </div>
                        <div class="space-y-2">
                            <label class="text-sm font-medium leading-none text-slate-900">Mã</label>
                            <input name="user_code" class="flex h-10 w-full rounded-md border border-slate-300 bg-transparent px-3 py-2 text-sm placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900 transition-colors" value="{{ user.user_code }}" required>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="space-y-2">
                            <label class="text-sm font-medium leading-none text-slate-900">Vai trò</label>
                            <select name="role" class="flex h-10 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 transition-colors">
                                {% for r in ['admin','manager','teacher','student','parent'] %}
                                <option value="{{ r }}" {% if user.role == r %}selected{% endif %}>{{ r }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="space-y-2">
                            <label class="text-sm font-medium leading-none text-slate-900">Điện thoại</label>
                            <input name="phone" class="flex h-10 w-full rounded-md border border-slate-300 bg-transparent px-3 py-2 text-sm placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900 transition-colors" value="{{ user.phone or '' }}">
                        </div>
                        <div class="space-y-2">
                            <label class="text-sm font-medium leading-none text-slate-900">Lớp / chức vụ</label>
                            <input name="position" class="flex h-10 w-full rounded-md border border-slate-300 bg-transparent px-3 py-2 text-sm placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900 transition-colors" value="{{ user.position or '' }}">
                        </div>
                        <div class="space-y-2">
                            <label class="text-sm font-medium leading-none text-slate-900">Lương/giờ</label>
                            <input name="salary_rate_per_hour" type="number" class="flex h-10 w-full rounded-md border border-slate-300 bg-transparent px-3 py-2 text-sm placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900 transition-colors" value="{{ user.salary_rate_per_hour or 0 }}">
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-sm font-medium leading-none text-slate-900">Liên kết học sinh</label>
                        <select name="linked_student_id" class="flex h-10 w-full max-w-sm rounded-md border border-slate-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 transition-colors">
                            <option value="">Không liên kết</option>
                            {% for s in students %}
                            <option value="{{ s.id }}" {% if user.linked_student_id == s.id %}selected{% endif %}>{{ s.fullname }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="flex items-center space-x-2 pt-2">
                        <input type="checkbox" id="is_active" name="is_active" value="1" class="h-4 w-4 rounded border-slate-300 text-slate-900 focus:ring-slate-900" {% if user.is_active %}checked{% endif %}>
                        <label for="is_active" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 text-slate-900">Tài khoản đang hoạt động</label>
                    </div>

                    <div class="pt-6 border-t border-slate-100 flex gap-3">
                        <button type="submit" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-950 bg-slate-900 text-slate-50 hover:bg-slate-900/90 h-10 px-6">
                            Lưu thông tin
                        </button>
                        <a href="{{ request.referrer or url_for('index') }}" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 border border-slate-200 bg-white hover:bg-slate-100 hover:text-slate-900 h-10 px-4">
                            Hủy
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div>
        <div class="rounded-xl border border-red-200 bg-red-50 shadow-sm overflow-hidden">
            <div class="p-6 pb-4 border-b border-red-100">
                <h3 class="font-semibold leading-none tracking-tight text-red-900">Đặt lại mật khẩu</h3>
                <p class="text-sm text-red-700 mt-1">Cấp lại mật khẩu mới cho người dùng này.</p>
            </div>
            <div class="p-6">
                <form method="post" action="{{ url_for('reset_password', user_id=user.id) }}" class="space-y-4" onsubmit="return confirm('Bạn có chắc muốn đặt lại mật khẩu cho người dùng này?')">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="space-y-2">
                        <label class="text-sm font-medium leading-none text-red-900">Mật khẩu mới</label>
                        <input name="password" class="flex h-10 w-full rounded-md border border-red-300 bg-white px-3 py-2 text-sm placeholder:text-red-400 focus:outline-none focus:ring-2 focus:ring-red-500 transition-colors" placeholder="Mặc định: 123456">
                    </div>
                    <button class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-950 bg-red-600 text-white hover:bg-red-700 h-10 px-4 w-full">
                        <i data-lucide="key-round" class="w-4 h-4 mr-2"></i> Reset mật khẩu
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
